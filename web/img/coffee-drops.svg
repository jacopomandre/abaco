<svg xmlns="http://www.w3.org/2000/svg" width="140" height="90" viewBox="0 0 140 90">
  <!-- A few coffee splashes on the Sketch theme's sheet, roughened like the ring -->
  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>
  <g filter="url(#rough)" fill="#7a4d24">
    <ellipse cx="38" cy="48" rx="13" ry="10" fill-opacity="0.22"/>
    <ellipse cx="38" cy="48" rx="13" ry="10" fill="none" stroke="#6b4220" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="66" cy="36" r="4.5" fill-opacity="0.26"/>
    <circle cx="80" cy="58" r="3"   fill-opacity="0.24"/>
    <circle cx="16" cy="26" r="2.5" fill-opacity="0.22"/>
    <circle cx="95" cy="44" r="2"   fill-opacity="0.2"/>
    <circle cx="58" cy="70" r="1.8" fill-opacity="0.2"/>
  </g>
</svg>
