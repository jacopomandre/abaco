<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Mug ring left on the Sketch theme's sheet: a faint wash with a darker dried edge,
       roughened by turbulence so it does not look like a drawn circle -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="10"/>
    </filter>
    <radialGradient id="wash">
      <stop offset="0.70" stop-color="#9a6a3a" stop-opacity="0.06"/>
      <stop offset="0.90" stop-color="#8a5a2b" stop-opacity="0.16"/>
      <stop offset="0.97" stop-color="#6b4220" stop-opacity="0.40"/>
      <stop offset="1"    stop-color="#6b4220" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g filter="url(#rough)">
    <circle cx="120" cy="120" r="92" fill="url(#wash)"/>
    <!-- Second, broken ring: the mug was set down twice, a little apart -->
    <circle cx="128" cy="113" r="88" fill="none" stroke="#6b4220" stroke-opacity="0.22"
            stroke-width="2.5" stroke-dasharray="210 40 120 60" stroke-linecap="round"/>
  </g>
</svg>
